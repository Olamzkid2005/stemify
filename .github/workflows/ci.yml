name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/web
      - run: npm run build -w apps/web

  worker:
    name: Worker tests and lint (py${{ matrix.python-version }}, torch ${{ matrix.torch-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    strategy:
      fail-fast: false
      matrix:
        include:
          # Original pin set: torch 2.5.1 supports Python 3.12 but has no 3.13 wheels.
          - python-version: "3.12"
            torch-version: "2.5.1"
            torch-index: "https://download.pytorch.org/whl/cpu"
          # Python 3.13 needs torch >= 2.6; exercises the weights_only compat shim.
          - python-version: "3.13"
            torch-version: "2.6.0"
            torch-index: "https://download.pytorch.org/whl/cpu"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Runtime stack first (torch from the CPU wheel index), then dev tooling.
      - run: >
          pip install torch==${{ matrix.torch-version }} torchaudio==${{ matrix.torch-version }}
          --index-url ${{ matrix.torch-index }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check worker tests
      - run: python -m pytest -v

  contracts:
    name: Contract schema validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest
